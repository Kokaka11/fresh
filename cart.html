<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Foods</title>
    <link rel="icon" href="img/icons.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
   <header class="header">
        <div class="container header-top">
            <div class="logo">
                <img src="img/icons.png" alt=""> 
                <h2><a href="index.html">Fresh Foods</a></h2>
            </div>
            <div class="header-actions">
                <div class="info-row">
                    <span>Ваш номер:</span>
                    <b id="user-phone-display">Загрузка...</b>
                </div>
            </div>
        </div>
        <nav class="main-nav container">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
            </ul>
        </nav>
    </header>

    <section class="cart-section">
    <div class="container">
        <h2>Ваша корзина</h2>
        
        <div class="cart-container">
            <!-- Список товаров -->
            <div class="cart-items" id="cart-items-container">
                <!-- Товар 1 (пример) -->
                <div class="cart-item">
                    <img src="img/apple.png" alt="Товар" class="item-img">
                    <div class="item-details">
                        <h3>Свежие овощи</h3>
                        <p class="item-price">500 ₽</p>
                    </div>
                    <div class="item-controls">
                        <button class="qty-btn">-</button>
                        <span class="qty-num">1</span>
                        <button class="qty-btn">+</button>
                    </div>
                    <button class="delete-btn">&times;</button>
                </div>
            </div>

            <!-- Итоговый чек -->
            <div class="cart-summary">
                <h3>Итого</h3>
                <div class="summary-row">
                    <span>Товары:</span>
                    <span id="total-items-price">0 ₽</span>
                </div>
                <div class="summary-row">
                    <span>Доставка:</span>
                    <span>Бесплатно</span>
                </div>
                <hr>
                <div class="summary-row total">
                    <span>К оплате:</span>
                    <strong id="final-price">0 ₽</strong>
                </div>
                <button class="checkout-btn">Оформить заказ</button>
            </div>
        </div>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
