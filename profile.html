<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Foods</title>
    <link rel="icon" href="img/icons.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <script>
    // Если пользователь УЖЕ залогинен, не показываем ему форму, а отправляем на главную
    if (localStorage.getItem('userId')) {
        window.location.href = 'index.html';
    }
    </script>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Авторизация</h2>
            <input type="tel" id="phone" pattern="[7-8]{1}[0-9]{10}" placeholder="+7 (___) ___-__-__">
            <button type="button" onclick="login(event)">Войти</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
